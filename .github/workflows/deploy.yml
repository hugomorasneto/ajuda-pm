name: Validar frontend e publicar via FTPS

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      backup_manifest_sha256:
        description: SHA-256 do manifesto da cópia verificada do destino
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && 'deploy-frontend-production' || format('frontend-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Conferir versões
        run: |
          node -v
          npm -v

      - name: Instalar dependências do lockfile
        run: npm ci

      - name: Validar e gerar o frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PUBLICAR: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        run: |
          if [[ "$PUBLICAR" == "true" ]] && [[ -z "$VITE_SUPABASE_URL" || -z "$VITE_SUPABASE_ANON_KEY" ]]; then
            echo "::error::Configure a URL e a chave pública do Supabase antes de publicar."
            exit 1
          fi
          npm run quality

      - name: Publicar em duas etapas via FTPS
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          BACKUP_MANIFEST_SHA256: ${{ inputs.backup_manifest_sha256 }}
        run: python3 scripts/ftps-release.py publish dist "$BACKUP_MANIFEST_SHA256"
