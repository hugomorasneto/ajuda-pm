name: Verificar FTPS em modo somente leitura

on:
  workflow_dispatch:
    inputs:
      backup_manifest_sha256:
        description: SHA-256 do manifesto verificado
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-ftps:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/ftps-verificacao-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Conferir o inventário por FTPS em modo somente leitura
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          BACKUP_MANIFEST_SHA256: ${{ inputs.backup_manifest_sha256 }}
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          import runpy
          import ssl

          release = runpy.run_path("scripts/ftps-release.py")
          expected = os.environ["BACKUP_MANIFEST_SHA256"]
          if not release["SHA256"].fullmatch(expected):
              raise SystemExit("Informe o SHA-256 do manifesto verificado.")
          try:
              with release["open_ftps"]() as ftp:
                  if ftp.pwd() != "/":
                      raise SystemExit("A conta não abriu a raiz isolada esperada.")
                  print(f"Login na raiz isolada confirmado com {ftp.sock.version()}.")
                  result = release["remote_inventory"](ftp)
          except ssl.SSLCertVerificationError:
              raise SystemExit("A validação do certificado FTPS falhou.") from None
          except ftplib.error_perm as error:
              code = str(error)[:3]
              raise SystemExit(f"O servidor recusou uma operação de leitura ou login (FTP {code if code.isdigit() else 'sem código'}).") from None
          except (OSError, EOFError, ftplib.Error, ValueError, release["TransferError"]) as error:
              raise SystemExit(f"A verificação FTPS falhou ({type(error).__name__}).") from None

          if release["fingerprint"](result) != expected:
              raise SystemExit("O inventário remoto diverge do manifesto verificado.")
          print(f"Manifesto confirmado. {len(result['files'])} arquivos e {len(result['directories'])} diretórios.")
          PY
